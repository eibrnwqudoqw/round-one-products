<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Round One responsive layout check</title>
    <style>
      body {
        margin: 16px;
        font: 16px Arial;
        background: #eee;
      }
      label {
        margin-right: 24px;
      }
      iframe {
        display: block;
        margin-top: 16px;
        border: 0;
        background: #111;
      }
    </style>
  </head>
  <body>
    <label
      >Viewport width
      <select id="width">
        <option>320</option>
        <option>375</option>
        <option>390</option>
        <option>600</option>
        <option>768</option>
        <option>1024</option>
        <option selected>1440</option>
        <option>1920</option>
      </select></label
    >
    <label
      >Page
      <select id="page">
        <option value="/">Home</option>
        <option value="/contact/">Contact</option>
        <option value="/personal-training/">Personal Training</option>
      </select></label
    >
    <iframe
      title="Website viewport"
      id="preview"
      src="/"
      width="1440"
      height="1100"
    ></iframe>
    <script>
      const frame = document.getElementById("preview");
      document.getElementById("width").addEventListener("change", (event) => {
        frame.width = event.target.value;
      });
      document.getElementById("page").addEventListener("change", (event) => {
        frame.src = event.target.value;
      });
    </script>
  </body>
</html>
