[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["products.json", "lib/catalogue-data.json", "lib/image-manifest.json"]
# Each route has its own index.html. Do not add a SPA catch-all.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/checkout/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
